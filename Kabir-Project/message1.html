<!DOCTYPE html>
<html>
<head>
<title>Message</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#667eea,#764ba2);
font-family:Arial;
color:white;
text-align:center;
}

.box{
background:rgba(255,255,255,0.15);
padding:50px;
border-radius:20px;
backdrop-filter:blur(10px);
animation:fadeIn 2s;
}

@keyframes fadeIn{
from{opacity:0; transform:scale(0.8);}
to{opacity:1; transform:scale(1);}
}

button{
margin-top:20px;
padding:12px 25px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="box">

<h1>✨ Harshini ✨</h1>

<p>
I wanted to tell you something for a long time.
</p>

<button onclick="next()">Next</button>

</div>

<script>
function next(){
window.location.href="message2.html";
}
</script>

</body>
</html>
