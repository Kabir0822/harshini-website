<!DOCTYPE html>
<html>
<head>
<title>Final Message</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff758c,#ff7eb3);
font-family:Arial;
color:white;
text-align:center;
}

.box{
background:rgba(255,255,255,0.15);
padding:50px;
border-radius:20px;
backdrop-filter:blur(10px);
animation:fadeIn 2s;
}

@keyframes fadeIn{
from{opacity:0; transform:scale(0.8);}
to{opacity:1; transform:scale(1);}
}

</style>

</head>

<body>

<div class="box">

<h1>Harshini 💖</h1>

<p>
You are a very special person and your smile makes the day brighter.
</p>

<p>
I just wanted to say that I really admire you and I hope we can become good friends.
</p>

<p>
— Kabir
</p>

</div>

</body>
</html>
